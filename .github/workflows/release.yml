name: Release Standalone App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows Executable
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Compile Standalone Executable and Tests
      run: cmake --build build --config Release

    - name: Run CTest Verification
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Prepare Distribution Directory
      shell: pwsh
      run: |
        $TAG = "${{ github.event.inputs.tag_name || github.ref_name }}"
        New-Item -ItemType Directory -Path dist -Force
        Copy-Item build/Release/HearThis.exe dist/HearThis.exe -Force
        Compress-Archive -Path dist/HearThis.exe -DestinationPath "dist/HearThis-$TAG-portable.zip" -Force

    - name: Build Windows Setup Installer with Inno Setup
      run: |
        iscc /DMyAppVersion=${{ github.event.inputs.tag_name || github.ref_name }} installer/HearThis.iss

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        name: "HearThis ${{ github.event.inputs.tag_name || github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/HearThis-Setup-*.exe
          dist/*-portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
