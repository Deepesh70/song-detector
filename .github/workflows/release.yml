name: Release Standalone App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Verification Test Suite
      run: |
        pytest -v

    - name: Build Standalone Executable with PyInstaller
      run: |
        pyinstaller HearThis.spec --noconfirm --clean

    - name: Create Release Zip Archive
      shell: pwsh
      run: |
        Compress-Archive -Path dist\HearThis.exe -DestinationPath dist\HearThis-windows-x64.zip -Force

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        name: "HearThis ${{ github.event.inputs.tag_name || github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/HearThis.exe
          dist/HearThis-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
